[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk"
version = "1.0.0"
description = "Powersports loan portfolio credit risk analytics: vintage analysis, roll rates, scorecard, cutoff strategy and loss forecasting."
requires-python = ">=3.10"
dependencies = ["duckdb>=1.1", "pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4", "matplotlib>=3.8", "openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
